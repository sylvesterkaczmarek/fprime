name: Validate AosFramer status handling
on:
  push:
    branches: [validation/fprime-5888-20260925]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FIX_SHA: 79f709787ad342153c6869c66a6dd4724fb0c0a1
      BASE_SHA: 0d4156ef9d685f2357008f1cbcf34bd3b3c10ecd
      BUILD: build-fprime-automatic-native-ut
      MODULE: Svc/Ccsds/AosFramer
      SOURCE: Svc/Ccsds/AosFramer/AosFramer.cpp
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out the exact contribution
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 79f709787ad342153c6869c66a6dd4724fb0c0a1
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned repository requirements
        run: python -m pip install -r requirements.txt
      - name: Build and test framer and adjacent components
        shell: bash
        run: |
          mkdir -p validation-logs
          fprime-util generate --ut -DFPRIME_ENABLE_AUTOCODER_UTS=OFF 2>&1 | tee validation-logs/generate.log
          cmake --build "$BUILD" --target Svc_Ccsds_AosFramer_ut_exe Svc_ComQueue_ut_exe Svc_ComStub_ut_exe -j4 2>&1 | tee validation-logs/build.log
          ctest --test-dir "$BUILD" -R '^(Svc_Ccsds_AosFramer|Svc_ComQueue|Svc_ComStub)_ut_exe$' --no-tests=error -V 2>&1 | tee validation-logs/fixed.log
      - name: Verify original duplicate-status regression
        shell: bash
        run: |
          git show "$BASE_SHA:$SOURCE" > "$SOURCE"
          cmake --build "$BUILD" --target Svc_Ccsds_AosFramer_ut_exe -j4 2>&1 | tee validation-logs/baseline-build.log
          set +e
          GTEST_FILTER=AosFramerStatus.PartialTailWaitsForStatus ctest --test-dir "$BUILD/F-Prime/$MODULE" --no-tests=error -V > validation-logs/baseline.log 2>&1
          result=$?
          set -e
          cat validation-logs/baseline.log
          test "$result" -ne 0
          grep -q 'Duplicate status after the upstream queue became ready' validation-logs/baseline.log
          grep -q 'Actual:   2' validation-logs/baseline.log
          git restore --source "$FIX_SHA" -- "$SOURCE"
          cmake --build "$BUILD" --target Svc_Ccsds_AosFramer_ut_exe -j4 2>&1 | tee validation-logs/restored-build.log
          ctest --test-dir "$BUILD/F-Prime/$MODULE" --no-tests=error -V 2>&1 | tee validation-logs/restored.log
      - name: Retain build and before-after test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fprime-5888-79f709787ad342153c6869c66a6dd4724fb0c0a1
          path: validation-logs/
          retention-days: 30
