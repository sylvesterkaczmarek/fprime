name: Validate configuration profile compiler settings
on:
  push:
    branches: [validation/fprime-5908-20260925]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact contribution
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 003393ddbbe52cc1233cf04b3fb992437532f225
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned repository requirements
        run: python -m pip install -r requirements.txt
      - name: Test profile compiler values and workflow wiring
        shell: bash
        run: |
          mkdir -p validation-logs
          python -m pytest -vv cmake/test/src/test_config_profiles.py 2>&1 | tee validation-logs/profiles.log
      - name: Reproduce cache-only behavior and verify the fix
        shell: bash
        run: |
          python - <<'PYCODE'
          import pathlib, subprocess
          root = pathlib.Path.cwd()
          source = root / 'validation-probe'
          build = source / 'build'
          source.mkdir()
          (source / 'CMakeLists.txt').write_text('''cmake_minimum_required(VERSION 3.18)
          project(ProfileReproduction C CXX)
          include_directories("${FRAMEWORK}" "${FRAMEWORK}/default" "${FRAMEWORK}/cmake/platform/unix")
          add_library(probe OBJECT probe.c probe.cpp)
          ''')
          for suffix in ('c', 'cpp'):
              (source / f'probe.{suffix}').write_text('#include <config/FpConfig.h>\n#if FW_OBJECT_NAMES != 0\n#error FW_OBJECT_NAMES_is_still_enabled\n#endif\n')
          def logged(args, name):
              p = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=90)
              (root / 'validation-logs' / name).write_text(p.stdout)
              print(p.stdout)
              return p
          args = ['cmake', '-S', str(source), '-B', str(build), f'-DFRAMEWORK={root}', '-DFW_OBJECT_NAMES=0']
          p = logged(args, 'baseline-generate.log')
          assert p.returncode == 0
          p = logged(['cmake', '--build', str(build), '-j2'], 'baseline-build.log')
          assert p.returncode != 0 and 'FW_OBJECT_NAMES_is_still_enabled' in p.stdout
          print('Original cache-only configuration failed the real-header compiler check as expected.')
          p = logged(args + [f'-DCMAKE_PROJECT_INCLUDE={root}/ci/apply-config-profile.cmake'], 'fixed-generate.log')
          assert p.returncode == 0
          p = logged(['cmake', '--build', str(build), '-j2'], 'fixed-build.log')
          assert p.returncode == 0
          print('With the hook, the identical C/C++ sources compile successfully.')
          PYCODE
      - name: Build and test actual no-object-names framework code
        shell: bash
        run: |
          fprime-util generate --ut -DCMAKE_PROJECT_INCLUDE="$PWD/ci/apply-config-profile.cmake" -DFW_OBJECT_NAMES=0 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DFPRIME_SUB_BUILD_JOBS=4 2>&1 | tee validation-logs/framework-generate.log
          cmake --build build-fprime-automatic-native-ut --target Fw_Obj Svc_RateGroupDriver_ut_exe -j4 2>&1 | tee validation-logs/framework-build.log
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build-fprime-automatic-native-ut/F-Prime/Svc/RateGroupDriver --no-tests=error -V 2>&1 | tee validation-logs/framework-tests.log
          nm -C build-fprime-automatic-native-ut/lib/Linux/libFw_Obj.a > validation-logs/obj-symbols.log
          grep -q 'Fw::ObjBase::ObjBase' validation-logs/obj-symbols.log
          if grep -q 'Fw::ObjBase::getObjName' validation-logs/obj-symbols.log; then
            echo 'Object-name API remains in the no-object-names library'; exit 1
          fi
      - name: Verify a consuming project and generated sources
        shell: bash
        run: |
          cmake -S cmake/test/data/TestFlagsProject -B consumer-profile-build -DCMAKE_PROJECT_INCLUDE="$PWD/ci/apply-config-profile.cmake" -DFW_OBJECT_NAMES=0 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DFPRIME_SUB_BUILD_JOBS=4 2>&1 | tee validation-logs/consumer-generate.log
          cmake --build consumer-profile-build --target TestFlags_FlagsComponent -j4 2>&1 | tee validation-logs/consumer-build.log
          python - <<'PYCODE' | tee validation-logs/compiler-definitions.log
          import json, pathlib, shlex
          pairs = [(pathlib.Path('build-fprime-automatic-native-ut'), ('ObjBase.cpp', 'bsd_random.c', 'RateGroupDriverComponentAc.cpp')), (pathlib.Path('consumer-profile-build'), ('FlagsComponentComponentAc.cpp',))]
          for build, names in pairs:
              entries = json.loads((build / 'compile_commands.json').read_text())
              for name in names:
                  matches = [e for e in entries if pathlib.Path(e['file']).name == name]
                  assert matches, name
                  assert all('-DFW_OBJECT_NAMES=0' in shlex.split(e['command']) for e in matches), name
                  print(f'{name}: FW_OBJECT_NAMES=0 verified in {len(matches)} compiler commands')
              cache = (build / 'sub-build-info-cache' / 'CMakeCache.txt').read_text()
              assert 'FW_OBJECT_NAMES:UNINITIALIZED=0' in cache
              assert 'CMAKE_PROJECT_INCLUDE:UNINITIALIZED=' in cache
              print(f'{build}: profile and hook propagated to the separate sub-build')
          PYCODE
          git diff --check
      - name: Retain reproducible validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fprime-5908-003393ddbbe52cc1233cf04b3fb992437532f225
          path: validation-logs/
          retention-days: 30
