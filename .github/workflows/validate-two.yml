name: Validate AOS padding and CFDP regressions
on:
  push:
    branches: [validation/fprime-two-20260926]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - issue: "5881"
            sha: a1499bae9495cd456beff60da7999450f41e3e65
            cc: gcc
            cxx: g++
          - issue: "5910"
            sha: e0168214e662f30efaadb9e2b025355af62e8884
            cc: clang
            cxx: clang++
    env:
      BASE_SHA: 0d4156ef9d685f2357008f1cbcf34bd3b3c10ecd
      FIX_SHA: ${{ matrix.sha }}
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      VALIDATION_LOG_DIR: ${{ github.workspace }}/validation-logs-${{ matrix.issue }}
      CFDP_BUILD: build-fprime-automatic-native-ut
    steps:
      - name: Check out validation scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: validation
          persist-credentials: false
      - name: Check out the exact submitted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.sha }}
          path: source
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: source/requirements.txt
      - name: Install the pinned repository requirements
        working-directory: source
        run: python -m pip install -r requirements.txt
      - name: Configure exact source with sanitizers
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$FIX_SHA"
          mkdir -p "$VALIDATION_LOG_DIR"
          "$CXX" --version | tee "$VALIDATION_LOG_DIR/compiler.log"
          fprime-util generate --ut -DFPRIME_ENABLE_AUTOCODER_UTS=OFF -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" 2>&1 | tee "$VALIDATION_LOG_DIR/generate.log"
      - name: Validate idle padding and reproduce the original failure
        if: matrix.issue == '5881'
        working-directory: source
        run: bash ../validation/ci/validation-two/verify-5881.sh
      - name: Validate CFDP tests and their defect sensitivity
        if: matrix.issue == '5910'
        working-directory: source
        run: python ../validation/ci/validation-two/verify-5910.py
      - name: Verify clean restored source
        working-directory: source
        run: git diff --exit-code
      - name: Retain validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fprime-${{ matrix.issue }}-${{ matrix.sha }}
          path: ${{ env.VALIDATION_LOG_DIR }}/
          retention-days: 30
